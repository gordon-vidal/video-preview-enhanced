# Automatic release: every push to main that changes package.json runs this workflow. If the
# "version" in package.json has no tag yet (v<version>), it tests, packages, publishes to the VS
# Marketplace (Trusted Publishing, no stored token), optionally to Open VSX, then creates the tag
# v<version> and a GitHub Release with the VSIX and the CHANGELOG section as notes. A push that does
# not change the version finds the tag and does nothing. Manual fallback: Actions > Publish > Run
# workflow (on main; the dry_run input stops after packaging). Steps and checks: docs/RELEASING.md.
#
# Marketplace authentication is Trusted Publishing (GitHub OIDC), as documented in
# https://code.visualstudio.com/api/working-with-extensions/publishing-extension#publish-with-github-actions-and-trusted-publishing
# The publisher's Trusted Publishing policy names owner gordon-vidal, repository video-preview-enhanced,
# workflow file publish.yml and no environment, so this file must keep its name and the Marketplace
# job must not use a GitHub environment. The job needs `id-token: write`, and publishes with
# `vsce publish --oidc` (the token exchange is single use and the credential lasts 15 minutes, so
# packaging happens in an earlier job).
name: Publish

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:
    inputs:
      pre_release:
        description: Publish as a pre-release
        required: false
        type: boolean
        default: false
      open_vsx:
        description: Also publish to Open VSX (needs the OVSX_PAT secret; skipped without it)
        required: false
        type: boolean
        default: true
      dry_run:
        description: Dry run - check, test and package only; publish nothing, create no tag or release
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time; a second bump waits (it is never cancelled half-way through a publish).
concurrency:
  group: publish
  cancel-in-progress: false

env:
  VSCE_VERSION: 4.1.1
  OVSX_VERSION: 1.4.0

jobs:
  check:
    name: Is there a new version?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Read the version, look for its tag
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          DRY: ${{ inputs.dry_run }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then echo "::error::Publish from main only (this run is on $REF)."; exit 1; fi
          VERSION=$(node -p "require('./package.json').version")
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "::error::package.json version '$VERSION' is not x.y.z."; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -n "$(git ls-remote --tags origin "refs/tags/v${VERSION}")" ]; then
            if [ "$DRY" = "true" ]; then
              echo "::notice::Tag v${VERSION} exists; continuing because this is a dry run."
              echo "release=true" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::Tag v${VERSION} already exists: version not bumped, nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          # New version: CHANGELOG.md must have its section (a heading "## <version>" and some text).
          awk -v v="## ${VERSION}" 'index($0, v) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then echo "::error::CHANGELOG.md has no '## ${VERSION}' section with content; add it in the same commit as the version bump."; exit 1; fi
          echo "release=true" >> "$GITHUB_OUTPUT"

  package:
    name: Check and package
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      vsix: ${{ steps.pack.outputs.vsix }}
    steps:
      # lfs: true downloads the test videos for the tests below; a release is rare, so the bandwidth is fine.
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg (for the tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install
        run: npm ci

      - name: Syntax check
        run: |
          git ls-files 'src/*.js' 'media/*.js' 'test/**/*.js' 'build/**/*.js' \
            | xargs -n 1 node --check

      - name: Hygiene checks
        run: |
          node tools/check-personal-data.js
          node tools/check-links.js

      - name: Tests
        run: |
          node test/run.js unit engine

      - name: Package
        id: pack
        env:
          VERSION: ${{ needs.check.outputs.version }}
          PRE: ${{ inputs.pre_release }}
        run: |
          VSIX="video-preview-enhanced-${VERSION}.vsix"
          FLAGS=""
          if [ "$PRE" = "true" ]; then FLAGS="--pre-release"; fi
          npx --yes "@vscode/vsce@${VSCE_VERSION}" package $FLAGS --out "$VSIX"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: ${{ steps.pack.outputs.vsix }}
          retention-days: 30

  marketplace:
    name: VS Marketplace
    needs: [check, package]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No `environment:` here: the Trusted Publishing policy has none.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: vsce publish --oidc
        env:
          VSIX: ${{ needs.package.outputs.vsix }}
        run: npx --yes "@vscode/vsce@${VSCE_VERSION}" publish --oidc --packagePath "$VSIX"

  open-vsx:
    name: Open VSX
    needs: [package, marketplace]
    if: ${{ !inputs.dry_run && inputs.open_vsx != false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Token present?
        id: token
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then echo "have=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::OVSX_PAT is not set: skipping Open VSX."; echo "have=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.token.outputs.have == 'true'
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        if: steps.token.outputs.have == 'true'
        with:
          name: vsix

      - name: ovsx publish
        if: steps.token.outputs.have == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX: ${{ needs.package.outputs.vsix }}
          PRE: ${{ inputs.pre_release }}
        run: |
          FLAGS=""
          if [ "$PRE" = "true" ]; then FLAGS="--pre-release"; fi
          npx --yes "ovsx@${OVSX_VERSION}" publish "$VSIX" -p "$OVSX_PAT" $FLAGS

  # Runs only when the Marketplace publish succeeded (a failed publish leaves no tag or release, so
  # the next run can try again). Open VSX is independent: its failure does not block the release.
  github-release:
    name: Tag and GitHub Release
    needs: [check, package, marketplace]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/download-artifact@v4
        with:
          name: vsix

      # Creates the tag v<version> on this commit and the release with the CHANGELOG section as
      # notes. An existing (for example draft) release for the tag is updated and published instead.
      - name: Create the tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          VSIX: ${{ needs.package.outputs.vsix }}
          PRE: ${{ inputs.pre_release }}
        run: |
          TAG="v${VERSION}"
          awk -v v="## ${VERSION}" 'index($0, v) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then echo "::error::CHANGELOG.md has no '## ${VERSION}' section."; exit 1; fi
          PREFLAG=""
          if [ "$PRE" = "true" ]; then PREFLAG="--prerelease"; fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$VSIX" --clobber
            gh release edit "$TAG" --draft=false $PREFLAG
          else
            gh release create "$TAG" "$VSIX" --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA" $PREFLAG
          fi
