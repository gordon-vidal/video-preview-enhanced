# TEMPORARY (removed before merge): checks how ffmpeg on the runner interleaves the picture-subtitle test media.
name: Diag (temporary)
on:
  pull_request:
permissions:
  contents: read
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg && ffmpeg -hide_banner -version | head -n 1
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($i = 1; $i -le 4 -and -not (Get-Command ffmpeg -ErrorAction SilentlyContinue); $i++) {
            if ($i -gt 1) { Start-Sleep -Seconds (20 * $i) }
            choco install ffmpeg -y --no-progress
          }
          ffmpeg -hide_banner -version | Select-Object -First 1
      - name: Interleaving of the made files
        run: |
          node test/bitmapsubs/diag_tmp.js 24
          node test/bitmapsubs/diag_tmp.js 24 --busy
      - name: Picture subtitle test, 10 times on fresh media
        shell: bash
        run: |
          fails=0
          for i in $(seq 1 10); do node test/bitmapsubs/run.js "$RUNNER_TEMP/bs$i" > "$RUNNER_TEMP/bs$i.log" 2>&1 || { fails=$((fails+1)); grep FAIL "$RUNNER_TEMP/bs$i.log"; }; done
          echo "bitmapsubs failed $fails of 10"
          test $fails -eq 0
      - name: Remote stream test, 6 times with a busy CPU (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node -e "const {Worker}=require('worker_threads');for(let i=0;i<3;i++)new Worker('for(;;){}',{eval:true})" &
          hog=$!
          fails=0
          for i in $(seq 1 6); do node test/host/remotestream_test.js > "$RUNNER_TEMP/rs$i.log" 2>&1 || { fails=$((fails+1)); tail -c 4000 "$RUNNER_TEMP/rs$i.log"; }; done
          kill $hog || true
          echo "remotestream failed $fails of 6"
          test $fails -eq 0
